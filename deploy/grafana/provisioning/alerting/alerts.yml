apiVersion: 1
groups:
  - orgId: 1
    name: maintenance-api
    folder: Maintenance
    interval: 1m
    rules:
      - uid: high-5xx-ratio
        title: Высокая доля ответов 5xx
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Доля ответов 5xx выше 5% за последние 5 минут
          description: См. раздел «Рост доли 5xx» в README (поиск по requestId в логах api).
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              expr: 'sum(rate(maintenance_api_http_requests_total{status_code=~"5.."}[5m])) / sum(rate(maintenance_api_http_requests_total[5m]))'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.05] }
      - uid: service-down
        title: Сервис недоступен
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: Prometheus не может опросить /metrics приложения
          description: Проверьте docker compose ps и логи api.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              expr: 'up{job="maintenance-api"}'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
