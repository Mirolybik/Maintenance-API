services:
  db:
    image: postgres:16-alpine
    container_name: maintenance_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-maintenance_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-maintenance_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Одноразовый шаг: миграции + сиды (воспроизводимо, повторный запуск безопасен)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: maintenance_migrate
    env_file: .env
    environment:
      DB_HOST: db
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - app_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maintenance_api
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DB_HOST: db
      PORT: 3000
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  nginx:
    image: nginx:1.25-alpine
    container_name: maintenance_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: maintenance_prometheus
    restart: always
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: maintenance_grafana
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-maintenance_db}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      db:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - app_network

volumes:
  pgdata:
  grafanadata:
  promdata:

networks:
  app_network:
    driver: bridge
